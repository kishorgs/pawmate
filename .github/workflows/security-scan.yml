name: security/scan

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - development

jobs:
  security-scan:
    name: security/scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: secrets scanning step
        run: npx --yes gitleaks@8.21.2 detect --source . --no-git --redact

      - name: vulnerability scanning step
        run: npm audit --audit-level=high

      - name: security/scan
        run: npm run security:scan
