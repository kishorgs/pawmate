name: Security Scan

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - development

jobs:
  security-scan:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets scanning step
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Vulnerability scanning step
        run: npm audit --audit-level=high
