name: Release Tag Automation

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-tag:
    name: release tag automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release tag automation
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: CHANGELOG.md
