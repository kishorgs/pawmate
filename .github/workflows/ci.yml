name: CI

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - development

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Coverage gate threshold
        run: npm run test:cov -- --coverageThreshold='{"global":{"branches":3,"functions":2,"lines":3,"statements":3}}'

  security-scan:
    name: security/scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: secrets scanning step
        run: npx --yes gitleaks@8.21.2 detect --source . --no-git --redact

      - name: vulnerability scanning step
        run: npm audit --audit-level=high

      - name: security/scan
        run: npm run security:scan

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  package:
    name: Package container
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pawmate-api:${{ github.sha }} .
